# Builds the package on every push; a push to main hands it to the forum,
# which installs it when its version in package.xml is newer than the
# installed one. The deploy key runs one forced command on the forum's
# server (vzekc-deploy in vzekc/vm03-deploy).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find files -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build package
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: build/*.tar

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Deploy to the forum
        env:
          DEPLOY_FORUM_SSH_KEY: ${{ secrets.DEPLOY_FORUM_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_FORUM_SSH_KEY" > ~/.ssh/forum
          chmod 600 ~/.ssh/forum
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/forum -o IdentitiesOnly=yes vzekc-deploy@classic-computing.de < "$(ls "$RUNNER_TEMP"/package/*.tar)"
